<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>Tapsihan sa Asukarera - Login</title>
    <link rel="stylesheet" href="../Bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <section id="loginPage" class="login-page">
      <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
          <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 login-card">
              <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                  <img
                    src="../logo.jpg"
                    alt="Tapsihan Logo"
                    class="login-logo mb-3"
                  />
                  <h3 class="fw-bold mb-1">Tapsihan sa Asukarera</h3>
                  <p class="text-muted mb-0">Inventory System</p>
                </div>

                <form id="loginForm">

                  <div class="mb-3">
                    <label for="loginIdentifier" class="form-label"
                      >Username or email</label
                    >
                    <input
                      type="text"
                      id="loginIdentifier"
                      class="form-control"
                      placeholder="Enter username or email"
                      autocomplete="username"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="loginPassword" class="form-label"
                      >Password</label
                    >
                    <div class="password-field">
                      <input
                        type="password"
                        id="loginPassword"
                        class="form-control password-input"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                      />
                      <button
                        type="button"
                        class="btn password-toggle"
                        id="toggleLoginPassword"
                        aria-label="Show password"
                        aria-pressed="false"
                      >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                          <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="2" />
                          <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2" />
                        </svg>
                      </button>
                    </div>
                  </div>

                  <div
                    id="loginError"
                    class="alert alert-danger d-none py-2"
                    role="alert"
                  >
                    Invalid username or password.
                  </div>

                  <button type="submit" class="btn btn-danger w-100">
                    Login
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="../Bootstrap/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
  </body>
  
</html>
